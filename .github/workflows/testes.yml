name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci
          MYSQL_DATABASE: mediary_teste
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-ci --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg-ci
          POSTGRES_DB: origem_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-migracao.txt pypdf
      - run: mysql -h 127.0.0.1 -uroot -proot-ci -e "CREATE DATABASE IF NOT EXISTS migracao_teste"
      - name: Testes (unitários, integração com MySQL, IA com servidor falso, migração)
        env:
          MEDIARY_TEST_DATABASE_URL: mysql://root:root-ci@127.0.0.1:3306/mediary_teste
          MEDIARY_TEST_MIGRACAO_MYSQL_URL: mysql://root:root-ci@127.0.0.1:3306/migracao_teste
          MEDIARY_TEST_PG_URL: postgresql://postgres:pg-ci@127.0.0.1:5432/origem_teste
        run: python -m unittest discover -s tests -t . -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --legacy-peer-deps
      - run: npm run build
