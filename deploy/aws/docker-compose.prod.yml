# Produção na EC2: tudo no mesmo servidor, no mesmo endereço.
#   web     = Caddy com o frontend compilado + HTTPS automático (Let's Encrypt)
#   backend = Flask/gunicorn, acessível só pela rede interna (o Caddy encaminha /api)
# O banco é o RDS MySQL (fora daqui). Quem sobe isto é servidor/atualizar.sh, que
# antes grava os segredos do Parameter Store em /run/mediary/backend.env (tmpfs, 600).
services:
  backend:
    build:
      context: ../../backend
      args:
        BAIXAR_CA_RDS: "1"
    container_name: mediary-backend
    env_file:
      - /run/mediary/backend.env
    environment:
      AMBIENTE: producao
      DATABASE_SSL_CA: /app/certs/rds-global-bundle.pem
      FRONTEND_URL: https://${DOMINIO:?},https://www.${DOMINIO:?}
      GUNICORN_WORKERS: "2"
    expose: ["5000"]
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?}
        awslogs-group: /mediary/prod
        awslogs-stream: backend

  web:
    build:
      context: ../..
      dockerfile: deploy/aws/Dockerfile.web
    container_name: mediary-web
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina /mediary/prod/DOMINIO}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:?}
        awslogs-group: /mediary/prod
        awslogs-stream: web

volumes:
  caddy-data:
  caddy-config:
